<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Squircle verde iOS -->
  <rect width="512" height="512" rx="114" ry="114" fill="#30D158"/>

  <!-- Defs: gradiente sutil para dar profundidad -->
  <defs>
    <linearGradient id="gl" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <!-- Mancuerna rotada ~38° — pose dinámica -->
  <g transform="rotate(-38, 256, 256)" fill="url(#gl)">

    <!-- Plato exterior izquierdo -->
    <rect x="72" y="178" width="50" height="156" rx="22"/>

    <!-- Manga / collar izquierdo -->
    <rect x="122" y="200" width="44" height="112" rx="14"/>

    <!-- Barra central (más delgada y elegante) -->
    <rect x="166" y="234" width="180" height="44" rx="22"/>

    <!-- Manga / collar derecho -->
    <rect x="346" y="200" width="44" height="112" rx="14"/>

    <!-- Plato exterior derecho -->
    <rect x="390" y="178" width="50" height="156" rx="22"/>

  </g>
</svg>
